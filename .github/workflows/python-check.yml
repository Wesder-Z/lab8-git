name: Python checks

on:
  push:
    branches:
      - main
    tags:
      - lab8
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check syntax
        run: poetry run python -m compileall -q .

      - name: Check code style
        run: poetry run python -m flake8 .

      - name: Run tests
        run: poetry run python -m pytest -q
