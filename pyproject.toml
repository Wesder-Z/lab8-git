[project]
name = "lab8-ai-assistant"
version = "1.0.0"
description = "Лабораторная работа №8 с CLI и интеграцией внешнего ИИ API"
authors = [
    {name = "Борисов Анатолий Олегович", email = "283395834+Wesder-Z@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = ["openai>=1.0,<3.0"]

[project.scripts]
study-assistant = "study_assistant.cli:main"

[tool.poetry]
packages = [{include = "study_assistant", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
flake8 = ">=7,<8"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
